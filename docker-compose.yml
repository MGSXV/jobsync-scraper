services:
  app:
    # Built from this repo rather than pulled: this is a fork with the JobSpy
    # source added, so the upstream published image would not contain it.
    build:
      context: .
    image: jobsync-scraper:latest
    container_name: jobsync_app
    ports:
      - "3737:3737"
    environment:
      - NODE_ENV=production
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - DATABASE_URL=file:/data/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-your-auth-secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-you-encryption-key-here}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3737}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - TZ=${TZ:-America/Edmonton}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      # Reached over the compose network; the service publishes no host port.
      - JOBSPY_SERVICE_URL=${JOBSPY_SERVICE_URL:-http://jobspy:8000}
      - JOBSPY_TOKEN=${JOBSPY_TOKEN:-}
      - JOBSPY_ENABLED=${JOBSPY_ENABLED:-true}
    volumes:
      - ./jobsyncdb/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jobspy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # JobSpy scraper sidecar. Debian-based because JobSpy depends on pandas and
  # curl_cffi, which have no musl wheels.
  #
  # The app always reaches this over the compose network at http://jobspy:8000.
  # The published port below is only for you: it serves FastAPI's interactive
  # docs at http://localhost:18000/docs, which is the easiest way to try search
  # parameters by hand without going through an automation.
  #
  # Bound to 127.0.0.1 on purpose. Dropping the host prefix (just "18000:8000")
  # publishes it on every interface, which lets anyone who can reach this
  # machine run scrapes against job boards from your IP — set JOBSPY_TOKEN if
  # you do that.
  jobspy:
    build:
      context: ./services/jobspy
    image: jobsync-jobspy:latest
    container_name: jobsync_jobspy
    ports:
      - "127.0.0.1:${JOBSPY_HOST_PORT:-18000}:8000"
    environment:
      - TZ=${TZ:-America/Edmonton}
      - JOBSPY_TOKEN=${JOBSPY_TOKEN:-}
      # Per-site ceiling inside one request; the app's own timeout is the outer
      # bound (APP_CONSTANTS.JOBSPY_FETCH_TIMEOUT_MS).
      - JOBSPY_SITE_TIMEOUT_S=${JOBSPY_SITE_TIMEOUT_S:-240}
    restart: unless-stopped
